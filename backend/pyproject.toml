[project]
name = "sora-semanticlayer"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "boring-semantic-layer>=0.3.18",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.11",
    "ibis-framework[duckdb]>=11.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sora_semantic"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard/config" = "sora_semantic/dashboard/config"

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "httpx>=0.28.1",
]
