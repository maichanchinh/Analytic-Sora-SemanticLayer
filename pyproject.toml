[project]
name = "sora-semanticlayer"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "boring-semantic-layer>=0.3.18",
    "ibis-framework[duckdb]>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sora_semantic"]

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
]
